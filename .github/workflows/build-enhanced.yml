# Step 2.2 verification build: iTorrent Enhanced (unsigned).
#
# Builds the modified project (new identity, iOS 18.0 target, Firebase / Remote Config / ads removed)
# and checks the result. No Apple credentials, certificates, provisioning profiles or secrets are used.
# This is a Phase 2 check, not the final release pipeline (that is Phase 6).
#
# Run manually: GitHub > Actions > "Build iTorrent Enhanced (unsigned)" > Run workflow.

name: Build iTorrent Enhanced (unsigned)

on:
  workflow_dispatch:
    inputs:
      xcode_app:
        description: "Xcode folder under /Applications (e.g. Xcode_27.2.app). Blank = image default."
        required: false
        default: "Xcode_27.2.app"
      use_cache:
        description: "Cache the LibTorrent (CMake) build between runs"
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  group: build-enhanced-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build iTorrent Enhanced (unsigned)
    runs-on: xcode-27
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    env:
      WORKSPACE_FILE: iTorrent.xcworkspace
      SCHEME: iTorrent
      BUILD_ROOT: ${{ github.workspace }}/_ci
      XCODE_APP: ${{ inputs.xcode_app }}
      EXPECTED_BUNDLE_ID: com.rocinantexwing.itorrentenhanced
      EXPECTED_DISPLAY_NAME: iTorrent Enhanced
      EXPECTED_MIN_OS: "18.0"

    steps:
      - name: Checkout (recursive submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: |
          set -euo pipefail
          ls -d /Applications/Xcode* || true
          if [ -n "${XCODE_APP}" ]; then
            if [ -d "/Applications/${XCODE_APP}" ]; then
              sudo xcode-select -s "/Applications/${XCODE_APP}/Contents/Developer"
            else
              echo "::warning::/Applications/${XCODE_APP} not found; using the image default"
            fi
          fi

      - name: Show tooling
        run: |
          set -euo pipefail
          sw_vers; uname -m; xcode-select -p
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          swift --version; cmake --version; brew --version | head -1

      - name: Verify pinned dependency revisions
        run: |
          set -euo pipefail
          check() {
            local path="$1" expected="$2" actual
            actual="$(git -C "$path" rev-parse HEAD)"
            echo "$path -> $actual"
            [ "$actual" = "$expected" ] || { echo "::error::Pin mismatch for $path (expected $expected)"; exit 1; }
          }
          check Submodules/GCDWebServer                           993173736fa84a4174d2e3bc13cc746576025841
          check Submodules/LibTorrent-Swift                       82735476b1f7666058447a6d9a39b100e98c1208
          check Submodules/MVVMFoundation                         516f6dd163894b291f5589bb0e75004e2c2e39f6
          check Submodules/SwiftVLC                               f83a0368715a2b8e156fb06f87fc3d1729f93cc2
          check Submodules/LibTorrent-Swift/Thirdparty/libtorrent 6da363d2994f17c0b3c0450d124cf73a31a73847

      - name: Install Boost (Homebrew)
        run: |
          set -euo pipefail
          brew install boost
          brew list --versions boost

      - name: Compute cache key
        id: keys
        run: |
          set -euo pipefail
          fp="$({ xcodebuild -version; xcrun --sdk iphoneos --show-sdk-build-version; cmake --version | head -1; brew list --versions boost; echo "$GITHUB_WORKSPACE"; } | shasum -a 256 | cut -d' ' -f1)"
          echo "toolchain=$fp" >> "$GITHUB_OUTPUT"

      - name: Restore LibTorrent build cache
        id: libtorrent_cache
        if: ${{ inputs.use_cache }}
        uses: actions/cache@v6
        with:
          path: Submodules/LibTorrent-Swift/libtorrent-build
          key: libtorrent-${{ runner.os }}-${{ runner.arch }}-${{ steps.keys.outputs.toolchain }}-82735476b1f7-6da363d2994f-${{ hashFiles('Submodules/LibTorrent-Swift/make.sh') }}

      - name: Prepare LibTorrent (CMake)
        if: ${{ steps.libtorrent_cache.outputs.cache-hit != 'true' }}
        run: |
          set -euo pipefail
          zsh Submodules/LibTorrent-Swift/make.sh

      - name: List schemes
        run: |
          set -euo pipefail
          xcodebuild -list -workspace "$WORKSPACE_FILE"

      # Package.resolved had its removed dependencies pruned by hand. Let SwiftPM re-resolve once,
      # record exactly what changed, and fail if a removed dependency came back.
      - name: Resolve Swift packages
        run: |
          set -euo pipefail
          mkdir -p "$BUILD_ROOT"
          PR=iTorrent.xcworkspace/xcshareddata/swiftpm/Package.resolved
          cp "$PR" "$BUILD_ROOT/Package.resolved.before"
          xcodebuild -resolvePackageDependencies \
            -workspace "$WORKSPACE_FILE" -scheme "$SCHEME" \
            -clonedSourcePackagesDirPath "$BUILD_ROOT/SourcePackages"
          cp "$PR" "$BUILD_ROOT/Package.resolved"
          echo "--- Package.resolved changes made by resolution (empty = none):"
          diff -u "$BUILD_ROOT/Package.resolved.before" "$PR" || true
          echo "--- resolved identities:"
          grep -o '"identity" : "[^"]*"' "$PR" | sort
          if grep -qiE 'firebase|googleappmeasurement|grpc|leveldb|nanopb' "$PR"; then
            echo "::error::a removed dependency was re-resolved"; exit 1
          fi

      - name: Build (Release, iphoneos, unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace "$WORKSPACE_FILE" -scheme "$SCHEME" \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$BUILD_ROOT/DerivedData" \
            -clonedSourcePackagesDirPath "$BUILD_ROOT/SourcePackages" \
            -onlyUsePackageVersionsFromResolvedFile -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" PROVISIONING_PROFILE_SPECIFIER="" \
            2>&1 | tee "$BUILD_ROOT/xcodebuild.log" \
            | { if command -v xcbeautify >/dev/null 2>&1; then xcbeautify --renderer github-actions; else cat; fi; }

      - name: Verify application bundle
        run: |
          set -euo pipefail
          PRODUCTS="$BUILD_ROOT/DerivedData/Build/Products/Release-iphoneos"
          APP=""
          for c in "$PRODUCTS"/*.app; do [ -d "$c" ] && APP="$c" && break; done
          [ -n "$APP" ] || { echo "::error::no .app in $PRODUCTS"; ls -la "$PRODUCTS" || true; exit 1; }
          echo "App bundle: $APP"
          echo "$APP" > "$BUILD_ROOT/app_path.txt"
          pb() { /usr/libexec/PlistBuddy -c "Print :$1" "$APP/Info.plist"; }
          fail() { echo "::error::$1"; exit 1; }

          BID="$(pb CFBundleIdentifier)"
          NAME="$(pb CFBundleDisplayName)"
          MINOS="$(pb MinimumOSVersion)"
          EXE="$(pb CFBundleExecutable)"
          echo "CFBundleIdentifier : $BID"
          echo "CFBundleDisplayName: $NAME"
          echo "Version / build    : $(pb CFBundleShortVersionString) / $(pb CFBundleVersion)"
          echo "MinimumOSVersion   : $MINOS"
          echo "Executable archs   : $(lipo -archs "$APP/$EXE")"
          [ "$BID"   = "$EXPECTED_BUNDLE_ID" ]    || fail "bundle id is $BID"
          [ "$NAME"  = "$EXPECTED_DISPLAY_NAME" ] || fail "display name is $NAME"
          [ "$MINOS" = "$EXPECTED_MIN_OS" ]       || fail "MinimumOSVersion is $MINOS"

          echo "--- PlugIns:"
          ls -1 "$APP/PlugIns"
          WIDGET="$(ls -d "$APP"/PlugIns/*.appex | head -1)"
          WID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$WIDGET/Info.plist")"
          echo "Widget bundle id   : $WID"
          [ "$WID" = "$EXPECTED_BUNDLE_ID.ProgressWidget" ] || fail "widget id is $WID"

          echo "--- Frameworks:"
          ls -1 "$APP/Frameworks"
          if ls "$APP/Frameworks" | grep -qiE 'firebase|google|measurement'; then
            fail "analytics/ads frameworks are still embedded"
          fi
          for k in GADApplicationIdentifier SKAdNetworkItems; do
            if /usr/libexec/PlistBuddy -c "Print :$k" "$APP/Info.plist" >/dev/null 2>&1; then fail "Info.plist still has $k"; fi
          done
          [ ! -e "$APP/GoogleService-Info.plist" ] || fail "a Google service plist is still bundled"
          echo "--- Code signature (expected: not signed):"
          codesign -dv "$APP" 2>&1 | head -3 || true
          echo "Bundle checks passed."

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="$(cat "$BUILD_ROOT/app_path.txt")"
          rm -rf "$BUILD_ROOT/ipa" && mkdir -p "$BUILD_ROOT/ipa/Payload"
          cp -R "$APP" "$BUILD_ROOT/ipa/Payload/"
          (cd "$BUILD_ROOT/ipa" && zip -qry "../iTorrent-Enhanced-unsigned.ipa" Payload)
          ls -lh "$BUILD_ROOT/iTorrent-Enhanced-unsigned.ipa"
          shasum -a 256 "$BUILD_ROOT/iTorrent-Enhanced-unsigned.ipa"
          unzip -l "$BUILD_ROOT/iTorrent-Enhanced-unsigned.ipa" | grep -E "Payload/[^/]+\.app/(Info.plist|PlugIns/[^/]+/Info.plist)$"

      - name: Job summary
        if: always()
        run: |
          {
            echo "### Build iTorrent Enhanced (unsigned)"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Xcode: $(xcodebuild -version | tr '\n' ' ')"
            echo "- iOS SDK: $(xcrun --sdk iphoneos --show-sdk-version)"
            echo "- Result: \`${{ job.status }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: iTorrent-Enhanced-unsigned-ipa
          path: ${{ env.BUILD_ROOT }}/iTorrent-Enhanced-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload resolved package pins and build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            ${{ env.BUILD_ROOT }}/xcodebuild.log
            ${{ env.BUILD_ROOT }}/Package.resolved
          if-no-files-found: warn
          retention-days: 14
